<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>条件目录 · 设计预览</title>
<style>
:root{color-scheme:light dark;--bg:#f2f2f7;--panel:#fff;--ink:#202023;--sub:#77777d;--line:#e5e5ea;--green:#27844c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:22px -apple-system,BlinkMacSystemFont,sans-serif}header{padding:26px 36px;display:flex;justify-content:space-between;align-items:center}h1{font-size:32px;margin:0}small{color:var(--sub);font-size:17px}main{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:0 36px 30px}.panel{background:var(--panel);border-radius:26px;padding:26px}h2{font-size:25px;margin:0 0 22px}button,select,input{font:inherit;color:inherit;min-height:60px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 18px}button{cursor:pointer}.tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}.active{background:var(--ink);color:var(--panel)}.row{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-bottom:12px;background:var(--bg);border:0}.detail{display:grid;gap:18px}.badge{color:var(--green)}.muted{color:var(--sub);font-size:18px;line-height:1.6}.fields{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input{width:145px}.primary{background:var(--ink);color:var(--panel);width:100%}.rule{padding:20px;background:var(--bg);border-radius:18px;font-size:20px;line-height:1.7}#result{min-height:52px;font-size:18px}.label{font-size:18px;color:var(--sub)}@media(prefers-color-scheme:dark){:root{--bg:#171719;--panel:#252527;--ink:#f2f2f7;--sub:#aaaab0;--line:#3b3b3e;--green:#72ca90}}@media(max-width:850px){main{grid-template-columns:1fr}}
</style>
<header><h1>添加执行条件</h1><small>交互设计预览 · 非实车数据</small></header>
<main><section class="panel"><h2>选择车辆状态</h2><div class="tabs" id="tabs"></div><div id="list"></div><p class="muted">已找到接口 ≠ 已验证可用。候选状态完成实车验证后才进入正式列表。</p></section>
<section class="panel detail"><h2 id="name">露营模式</h2><div class="badge" id="status">状态字段已核实</div><div class="label">判断方式</div><div class="fields"><select id="op" aria-label="比较方式"></select><input id="value" type="number" aria-label="阈值" hidden><span id="unit"></span></div><div class="muted" id="note"></div><div class="rule"><div class="label">规则预览 · 露营防误触</div><p id="preview"></p><div>则禁止：四门开关</div><small>其它动作不受此规则影响</small></div><button class="primary" id="add">加入规则预览</button><div id="result" role="status"></div><div class="muted">受保护动作：状态未知时拦截。试算与设计预览不会操作车辆。</div></section></main>
<script>
const items=[{cat:'场景',name:'露营模式',type:'enum',verified:true,note:'实车字段已确认：3 开启、0 关闭；其它值未知。'}, {cat:'行驶',name:'挡位',type:'gear',note:'已有挡位读取；继续核实枚举及异常值。'}, {cat:'行驶',name:'车速',type:'number',unit:'km/h',value:5,note:'候选接口已找到，单位和实际读取待验证。'}, {cat:'能源',name:'电量',type:'number',unit:'%',value:20,note:'使用百分比接口，不能混用电池等级。待本车验证。'}, {cat:'车身',name:'主驾车门',type:'door',note:'运动/暂停与未知状态不能当作关闭。待枚举验证。'}, {cat:'座舱',name:'主驾座椅占用',type:'seat',note:'有人/无人/未知，待实车验证。'}, {cat:'环境',name:'车外温度',type:'number',unit:'°C',value:30,note:'候选接口已找到，范围及有效性待验证。'}];
let selected=items[0];const el=id=>document.getElementById(id);
function category(cat){el('tabs').replaceChildren();[...new Set(items.map(x=>x.cat))].forEach(c=>{let b=document.createElement('button');b.textContent=c;b.className=c===cat?'active':'';b.onclick=()=>category(c);el('tabs').append(b)});el('list').replaceChildren();items.filter(x=>x.cat===cat).forEach(x=>{let b=document.createElement('button');b.className='row';b.textContent=x.name+'　›';b.onclick=()=>pick(x);el('list').append(b)})}
function pick(x){selected=x;el('name').textContent=x.name;el('status').textContent=x.verified?'状态字段已核实':'候选 · 待读取验证';el('note').textContent=x.note;el('op').replaceChildren();let opts=x.type==='number'?['低于','高于','等于']:x.type==='gear'?['P 挡','非 P 挡']:x.type==='door'?['打开','关闭']:x.type==='seat'?['有人','无人']:['开启','关闭'];opts.forEach(t=>{let o=document.createElement('option');o.textContent=t;el('op').append(o)});el('value').hidden=x.type!=='number';el('value').value=x.value||0;el('unit').textContent=x.unit||'';el('result').textContent='';preview()}
function preview(){el('preview').textContent='当 '+selected.name+' '+el('op').value+(selected.type==='number'?' '+el('value').value+' '+selected.unit:'')}
el('op').onchange=preview;el('value').oninput=preview;el('add').onclick=()=>{el('result').textContent='已加入本页预览（不保存到车机）。正式规则可组合全部 AND / 任一 OR。'};category('场景');pick(selected);
</script></html>
